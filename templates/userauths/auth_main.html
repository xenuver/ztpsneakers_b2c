{% extends "base.html" %}

{% block title %}Masuk atau Daftar - ZTPSneakers{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <!-- Tabs -->
        <div class="flex border-b border-gray-100">
            <button type="button" 
                    hx-get="{% url 'userauths:auth_main' %}?tab=login" 
                    hx-target="#auth-content" 
                    class="w-1/2 py-4 text-center font-bold text-sm tracking-wider uppercase transition {% if active_tab == 'login' %}text-black border-b-2 border-black{% else %}text-gray-400 hover:text-gray-700{% endif %}">
                Masuk
            </button>
            <button type="button" 
                    hx-get="{% url 'userauths:auth_main' %}?tab=register" 
                    hx-target="#auth-content" 
                    class="w-1/2 py-4 text-center font-bold text-sm tracking-wider uppercase transition {% if active_tab == 'register' %}text-black border-b-2 border-black{% else %}text-gray-400 hover:text-gray-700{% endif %}">
                Daftar
            </button>
        </div>
        
        <div id="auth-content" class="p-8">
            {% if active_tab == 'login' %}
                {% include "userauths/partials/login_form.html" %}
            {% else %}
                {% include "userauths/partials/register_form.html" %}
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
