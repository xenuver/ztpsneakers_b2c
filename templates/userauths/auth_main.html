{% extends "base.html" %}

{% block title %}Masuk atau Daftar - ZTPSneakers{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-8 text-center border-b border-gray-100">
            <h2 class="text-2xl font-heading font-extrabold text-black uppercase tracking-tight">Masuk / Daftar</h2>
            <p class="text-sm text-gray-500 mt-2">Belanja makin mudah dengan akun ZTPSneakers</p>
        </div>
        
        <div id="auth-content" class="p-8">
            <div id="auth-error" class="mb-4"></div>
            <form action="{% url 'userauths:auth_check' %}" method="POST" hx-post="{% url 'userauths:auth_check' %}" hx-target="#auth-content" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email atau No HP</label>
                    <input type="text" name="identifier" required placeholder="Contoh: 08123456789 / email@contoh.com" class="w-full rounded-md border border-gray-300 px-3 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
                </div>
                <button type="submit" class="w-full py-3 bg-primary text-white text-sm font-bold uppercase tracking-wider rounded-md hover:bg-primary/90 transition flex justify-center items-center gap-2">
                    Lanjut
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
