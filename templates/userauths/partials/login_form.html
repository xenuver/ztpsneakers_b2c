<div id="auth-error" class="mb-4"></div>
<form action="{% url 'userauths:auth_login' %}" method="POST" hx-post="{% url 'userauths:auth_login' %}" hx-target="#auth-error" class="space-y-4">
    {% csrf_token %}
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email atau No HP</label>
        <input type="text" name="identifier" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Password</label>
        <input type="password" name="password" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
    </div>
    <div class="flex items-center justify-between mt-2">
        <a href="{% url 'account_reset_password' %}" class="text-xs text-gray-500 hover:text-black">Lupa Password?</a>
    </div>
    <button type="submit" class="w-full py-3 bg-black text-white text-sm font-bold uppercase tracking-wider rounded-md hover:bg-gray-800 transition">
        Masuk
    </button>
</form>
