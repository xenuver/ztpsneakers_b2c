<form hx-post="{% url 'userauths:auth_login' %}" hx-target="#auth-error" hx-swap="innerHTML" class="mt-8 space-y-6">
    {% csrf_token %}
    <div class="text-sm text-gray-600 mb-4 text-center">
        Selamat datang kembali!
    </div>

    <div class="space-y-4">
        <div>
            <label for="identifier" class="sr-only">Email atau Nomor HP</label>
            <input id="identifier" name="identifier" type="text" value="{{ identifier }}" readonly class="appearance-none rounded-md relative block w-full px-3 py-3 border border-gray-300 bg-gray-100 text-gray-500 focus:outline-none sm:text-sm cursor-not-allowed" placeholder="Email atau Nomor HP">
        </div>

        <div>
            <label for="password" class="sr-only">Password</label>
            <input id="password" name="password" type="password" required class="appearance-none rounded-md relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-black focus:border-black sm:text-sm transition-all" placeholder="Password">
        </div>
    </div>
    
    <div id="auth-error"></div>

    <div class="flex items-center justify-between">
        <div class="text-sm">
            <a href="{% url 'account_reset_password' %}" class="font-medium text-black hover:text-gray-800">Lupa password?</a>
        </div>
    </div>

    <div>
        <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-md text-white bg-primary hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all uppercase tracking-widest">
            Masuk
        </button>
    </div>
</form>
