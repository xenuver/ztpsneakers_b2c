<form hx-post="{% url 'userauths:auth_login' %}" hx-target="#auth-error" hx-swap="innerHTML" class="mt-8 space-y-6">
    {% csrf_token %}
    <input type="hidden" name="identifier" value="{{ identifier }}">
    
    <div class="text-sm text-gray-600 mb-4">
        Selamat datang kembali, <strong>{{ identifier }}</strong>
    </div>

    <div class="rounded-md shadow-sm -space-y-px">
        <div>
            <label for="password" class="sr-only">Password</label>
            <input id="password" name="password" type="password" required class="appearance-none rounded-md relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-black focus:border-black focus:z-10 sm:text-sm transition-all" placeholder="Password">
        </div>
    </div>
    
    <div id="auth-error"></div>

    <div class="flex items-center justify-between">
        <div class="text-sm">
            <a href="#" class="font-medium text-black hover:text-gray-800">Lupa password?</a>
        </div>
    </div>

    <div>
        <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-black hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black transition-all">
            Masuk
        </button>
    </div>
</form>
