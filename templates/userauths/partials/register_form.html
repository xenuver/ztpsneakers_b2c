<div id="auth-error" class="mb-4"></div>
<form action="{% url 'userauths:auth_register' %}" method="POST" hx-post="{% url 'userauths:auth_register' %}" hx-target="#auth-error" class="space-y-4">
    {% csrf_token %}
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Nama Lengkap</label>
        <input type="text" name="name" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email</label>
        <input type="email" name="email" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">No HP</label>
        <input type="text" name="phone_number" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Password</label>
        <input type="password" name="password" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Konfirmasi Password</label>
        <input type="password" name="password_confirm" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
    </div>
    <button type="submit" class="w-full py-3 bg-black text-white text-sm font-bold uppercase tracking-wider rounded-md hover:bg-gray-800 transition">
        Daftar Sekarang
    </button>
</form>
