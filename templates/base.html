<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZTP Sneakers{% endblock %}</title>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0B6A42', // Dark Forest Green from ZTPSneakers
                        surface: '#FFFFFF',
                        accent: '#000000',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        serif: ['Outfit', 'ui-serif', 'Georgia', 'serif'],
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(-20%)' },
                            '100%': { transform: 'translateX(100vw)' },
                        }
                    },
                    animation: {
                        marquee: 'marquee 25s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .font-luxury {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
    </style>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-light text-textPrimary font-sans antialiased h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
        {% for message in messages %}
        <div
            class="px-4 py-2 rounded shadow-lg {% if message.tags == 'error' %}bg-red-500 text-white{% else %}bg-accent text-black font-bold{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="h-full w-full">
        {% include "partials/navbar.html" %}

        {% block content %}
        {% endblock %}

        {% include "partials/footer.html" %}
    </main>

    <!-- Cart Drawer Container -->
    <div id="cart-drawer-container" class="fixed inset-0 z-[100] hidden overflow-hidden"
        aria-labelledby="slide-over-title" role="dialog" aria-modal="true"></div>

    <script>
        function openCart() {
            const container = document.getElementById('cart-drawer-container');
            container.classList.remove('hidden');
            setTimeout(() => {
                const drawer = document.getElementById('cart-drawer');
                if (drawer) {
                    drawer.classList.remove('translate-x-full');
                    drawer.classList.add('translate-x-0');
                }
            }, 10);
        }

        function closeCart() {
            const container = document.getElementById('cart-drawer-container');
            const drawer = document.getElementById('cart-drawer');
            if (drawer) {
                drawer.classList.remove('translate-x-0');
                drawer.classList.add('translate-x-full');
            }
            setTimeout(() => {
                container.classList.add('hidden');
            }, 500);
        }

        document.body.addEventListener('openCart', function () {
            openCart();
        });
    </script>

    {% block extra_scripts %}{% endblock %}

</body>

</html>
