<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZTP Sneakers{% endblock %}</title>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0B6A42', // Dark Forest Green from ZTPSneakers
                        surface: '#FFFFFF',
                        accent: '#000000',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        serif: ['Outfit', 'ui-serif', 'Georgia', 'serif'],
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(-20%)' },
                            '100%': { transform: 'translateX(100vw)' },
                        }
                    },
                    animation: {
                        marquee: 'marquee 25s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .font-luxury {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
    </style>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-light text-textPrimary font-sans antialiased h-screen">

    {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
        {% for message in messages %}
        <div
            class="px-4 py-2 rounded shadow-lg {% if message.tags == 'error' %}bg-red-500 text-white{% else %}bg-accent text-black font-bold{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="h-full w-full">
        {% include "partials/navbar.html" %}

        {% block content %}
        {% endblock %}

        {% include "partials/footer.html" %}
    </main>

    <!-- Cart Drawer Container -->
    <div id="cart-drawer-container"></div>

    <!-- Crisp Live Chat Integration -->
    <script type="text/javascript">
        window.$crisp = [];
        window.CRISP_WEBSITE_ID = "YOUR_CRISP_WEBSITE_ID"; // Ganti dengan Website ID asli
        (function() {
            d = document;
            s = d.createElement("script");
            s.src = "https://client.crisp.chat/l.js";
            s.async = 1;
            d.getElementsByTagName("head")[0].appendChild(s);
        })();

        // Pasang Identitas User jika sedang login
        {% if user.is_authenticated %}
        $crisp.push(["set", "user:email", ["{{ user.email }}"]]);
        {% if user.get_full_name %}
        $crisp.push(["set", "user:nickname", ["{{ user.get_full_name }}"]]);
        {% endif %}
        {% endif %}
    </script>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
