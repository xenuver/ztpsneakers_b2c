<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZTP Sneakers{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        light: '#FFFFFF',
                        surface: '#F9F9F9',
                        accent: '#000000',
                        textPrimary: '#000000',
                        textSecondary: '#666666'
                    }
                }
            }
        }
    </script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5/001a14R4aP4bE9n8wBq9bTq7Jj1d6aHn7gSjK8Fk5g5hM4I0yO2b7gSjK8Fk" crossorigin="anonymous"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light text-textPrimary font-sans antialiased h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    
    {% if messages %}
        <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
            {% for message in messages %}
                <div class="px-4 py-2 rounded shadow-lg {% if message.tags == 'error' %}bg-red-500 text-white{% else %}bg-accent text-black font-bold{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="h-full w-full">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
