{% if products %}
    <ul class="py-2 text-sm text-gray-700">
        {% for product in products %}
        <li>
            <a href="{% url 'storefront:product_detail' product.slug %}" class="flex items-center px-4 py-3 hover:bg-gray-50 transition">
                <div class="w-12 h-12 bg-gray-100 rounded flex items-center justify-center overflow-hidden flex-shrink-0">
                    {% if product.get_primary_image %}
                        <img src="{{ product.get_primary_image }}" alt="{{ product.name }}" class="w-full h-full object-cover">
                    {% else %}
                        <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    {% endif %}
                </div>
                <div class="ml-3 flex-1 min-w-0">
                    <p class="text-sm font-bold text-black truncate">{{ product.name }}</p>
                    <p class="text-xs text-gray-500 mt-0.5">Rp {{ product.price|floatformat:"0" }}</p>
                </div>
            </a>
        </li>
        {% endfor %}
    </ul>
    <div class="border-t border-gray-100 p-2">
        <button type="submit" form="search-form-navbar" class="w-full text-center py-2 text-xs font-bold text-primary hover:text-black uppercase tracking-wider transition">Lihat Semua Hasil</button>
    </div>
{% else %}
    <div class="px-4 py-6 text-center text-sm text-gray-500">
        Tidak ditemukan produk yang sesuai pencarian.
    </div>
{% endif %}
