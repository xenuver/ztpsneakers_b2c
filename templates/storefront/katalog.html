{% extends "base.html" %}

{% block title %}Katalog Produk - 807GARAGE{% endblock %}

{% block content %}
<div class="bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex items-baseline justify-between border-b border-gray-200 pb-6 mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-black">SEMUA PRODUK</h1>
            
            <div class="flex items-center">
                <!-- Search Bar -->
                <div class="relative mr-6">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" name="q" placeholder="Cari produk..." 
                           class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-black focus:border-black sm:text-sm transition"
                           hx-get="{% url 'storefront:catalog' %}" 
                           hx-trigger="keyup changed delay:300ms" 
                           hx-target="#produk-grid"
                           hx-include="#filter-form">
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-8">
            <!-- Sidebar Filter -->
            <aside class="w-full md:w-64 flex-shrink-0">
                <form id="filter-form" hx-get="{% url 'storefront:catalog' %}" hx-target="#produk-grid" hx-trigger="change">
                    <!-- Sort -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-black mb-3">Urutkan</h3>
                        <select name="sort" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-black focus:border-black sm:text-sm rounded-md">
                            <option value="-created_at">Terbaru</option>
                            <option value="price">Harga: Rendah ke Tinggi</option>
                            <option value="-price">Harga: Tinggi ke Rendah</option>
                        </select>
                    </div>

                    <!-- Category Filter -->
                    <div class="mb-6 pt-6 border-t border-gray-200">
                        <h3 class="text-sm font-medium text-black mb-3">Kategori</h3>
                        <div class="space-y-2">
                            <div class="flex items-center">
                                <input id="cat-all" name="category" value="" type="radio" checked class="h-4 w-4 border-gray-300 text-black focus:ring-black">
                                <label for="cat-all" class="ml-3 text-sm text-gray-600">Semua</label>
                            </div>
                            {% for cat in categories %}
                            <div class="flex items-center">
                                <input id="cat-{{ cat.id }}" name="category" value="{{ cat.id }}" type="radio" class="h-4 w-4 border-gray-300 text-black focus:ring-black">
                                <label for="cat-{{ cat.id }}" class="ml-3 text-sm text-gray-600">{{ cat.name }}</label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- Brand Filter -->
                    <div class="mb-6 pt-6 border-t border-gray-200">
                        <h3 class="text-sm font-medium text-black mb-3">Brand</h3>
                        <div class="space-y-2">
                            <div class="flex items-center">
                                <input id="brand-all" name="brand" value="" type="radio" checked class="h-4 w-4 border-gray-300 text-black focus:ring-black">
                                <label for="brand-all" class="ml-3 text-sm text-gray-600">Semua</label>
                            </div>
                            {% for brand in brands %}
                            <div class="flex items-center">
                                <input id="brand-{{ brand.id }}" name="brand" value="{{ brand.id }}" type="radio" class="h-4 w-4 border-gray-300 text-black focus:ring-black">
                                <label for="brand-{{ brand.id }}" class="ml-3 text-sm text-gray-600">{{ brand.name }}</label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </form>
            </aside>

            <!-- Product Grid -->
            <div class="flex-1">
                <div id="produk-grid" class="grid grid-cols-2 gap-x-4 gap-y-8 sm:grid-cols-3 lg:grid-cols-4 xl:gap-x-8">
                    {% include "storefront/partials/product_grid.html" %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
