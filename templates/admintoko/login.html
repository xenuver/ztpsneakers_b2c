{% extends "base.html" %}

{% block title %}Admin Toko Login - ZTPSneakers{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-sm border border-gray-100">
        <div class="text-center">
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900">Admin Toko Panel</h2>
            <p class="mt-2 text-sm text-gray-600">
                Gunakan kredensial staff Anda
            </p>
        </div>
        
        <div>
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div class="text-red-500 font-bold mb-4 text-center text-sm">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            
            <form action="{% url 'admintoko:login' %}" method="POST" class="mt-8 space-y-6">
                {% csrf_token %}
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label for="email" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email / Username</label>
                        <input id="email" name="email" type="text" required class="appearance-none rounded-md relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-black focus:border-black focus:z-10 sm:text-sm transition-all" placeholder="Email admin">
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Password</label>
                        <input id="password" name="password" type="password" required class="appearance-none rounded-md relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-black focus:border-black focus:z-10 sm:text-sm transition-all" placeholder="Password">
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-md text-white bg-primary hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all uppercase tracking-widest">
                        Masuk Dashboard
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
