<!-- Top Strip -->
<div class="bg-[#111827] text-white text-xs font-bold py-2 uppercase tracking-wider relative overflow-hidden h-8 flex items-center">
    <div class="whitespace-nowrap animate-marquee absolute text-center text-white font-extrabold tracking-widest">
        PROMO TERBATAS HARI INI - BELANJA SEKARANG UNTUK DISKON SPESIAL!
    </div>
    <button class="text-white hover:text-gray-300 absolute right-4 z-10 bg-[#111827] pl-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
</div>

<!-- Main Navbar -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center">
                <a href="/" class="text-3xl font-extrabold tracking-tighter text-black flex items-center gap-1">
                    8<svg class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z">
                        </path>
                    </svg>7
                </a>
            </div>

            <!-- Desktop Menu -->
            <div class="hidden md:flex flex-1 justify-center space-x-8">
                <a href="{% url 'storefront:catalog' %}"
                    class="text-sm font-semibold text-black uppercase tracking-wider hover:text-primary transition">BROWSE
                    ALL</a>
                <a href="{% url 'storefront:catalog' %}?sort=-created_at"
                    class="text-sm font-semibold text-black uppercase tracking-wider hover:text-primary transition">HOT
                    ITEM</a>

                <div class="relative group">
                    <button
                        class="text-sm font-semibold text-black uppercase tracking-wider hover:text-primary transition flex items-center">
                        CATEGORIES
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Search and Icons -->
            <div class="flex items-center space-x-6">
                <!-- Search -->
                <div class="hidden md:block relative w-64 lg:w-96">
                    <input type="text" placeholder="Search for products and brand"
                        class="w-full bg-gray-50 border-none rounded-full py-2 pl-10 pr-4 text-sm focus:ring-1 focus:ring-black placeholder-gray-400">
                    <svg class="w-4 h-4 text-gray-400 absolute left-4 top-2.5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <div class="flex items-center space-x-5">
                    <!-- Cart -->
                    <button type="button" class="text-black hover:text-primary transition relative"
                        onclick="openCart()">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                            </path>
                        </svg>
                    </button>
                    <!-- Heart -->
                    <button type="button" class="text-black hover:text-primary transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                            </path>
                        </svg>
                    </button>
                    <!-- Bell -->
                    <button type="button" class="text-black hover:text-primary transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                            </path>
                        </svg>
                    </button>
                    <!-- User -->
                    {% if user.is_authenticated %}
                    <div class="relative group">
                        <button type="button"
                            class="flex items-center space-x-2 bg-gray-50 rounded-full pl-1 pr-3 py-1 border border-gray-200 hover:border-primary transition cursor-pointer">
                            <div
                                class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-white text-xs font-bold">
                                {{ user.email|make_list|first|upper }}
                            </div>
                            <span class="text-xs font-semibold text-black">{{
                                user.username|default:user.email|truncatechars:10 }}</span>
                        </button>
                        <div
                            class="absolute right-0 w-48 mt-2 origin-top-right bg-white border border-gray-200 divide-y divide-gray-100 rounded-md shadow-lg hidden group-hover:block">
                            <div class="py-1">
                                <a href="{% url 'userauths:profile' %}"
                                    class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 font-bold uppercase tracking-wider">Profil
                                    Saya</a>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Pesanan
                                    Saya</a>
                            </div>
                            <div class="py-1">
                                <a href="{% url 'userauths:auth_logout' %}"
                                    class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-bold">Keluar</a>
                            </div>
                        </div>
                    </div>
                    {% else %}
                    <a href="{% url 'userauths:auth_main' %}"
                        class="text-sm font-semibold text-primary uppercase tracking-wider hover:text-white transition border border-primary rounded-full px-4 py-1 hover:bg-primary">Sign
                        In</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</nav>
